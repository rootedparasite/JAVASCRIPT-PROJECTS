<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Basic / Primary SEO -->

    <meta name="description" content="Shop fashion, accessories & lifestyle essentials at Aethal. Best prices, fast delivery across Pakistan, easy returns & secure checkout. Order online today!" />
    <meta name="keywords" content="Aethal, aethal.com, Aethal online store, online shopping, online shopping Pakistan, buy online, fashion online store, clothing, accessories, lifestyle products, ecommerce store, online store Pakistan, cash on delivery, free delivery, best online shopping deals" />
    <meta name="author" content="Aethal" />
    <meta name="application-name" content="Aethal" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="google" content="notranslate" />

    <meta name="google-site-verification" content="YOUR_GOOGLE_VERIFICATION_CODE" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aethal – Shop Fashion, Accessories & Lifestyle Online" />

    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ur_PK" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aethal – Online Shopping Made Simple" />
    <meta name="twitter:description" content="Shop fashion, accessories & lifestyle products at Aethal. Fast delivery, secure checkout & easy returns across Pakistan."/>

    <meta name="twitter:image:alt" content="Aethal Online Shopping Store" />
    <meta name="twitter:site" content="@aethal" />
    <meta name="twitter:creator" content="@aethal" />

    <!-- Browser / Theme -->
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)"/>
    <meta name="theme-color" content="#F0F0F0" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aethal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0B1220" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-TileImage" content="./assets/icons/mstile-144x144.jpg" />

    <!-- Language / Classification -->
    <meta http-equiv="Content-Language" content="en" />
    <meta name="language" content="English" />
    <meta name="rating" content="general" />
    <meta name="category" content="Shopping, E-commerce, Fashion, Lifestyle" />
    <meta name="coverage" content="Worldwide" />
    <meta name="distribution" content="global" />
    <meta name="copyright" content="Copyright © 2025 Aethal. All rights reserved." />
    <meta name="HandheldFriendly" content="true" />
    <meta name="MobileOptimized" content="320" />

    <!-- Canonical & hreflang -->
    <link rel="canonical" href="https://aethal.com/" />
    <link rel="alternate" hreflang="en" href="https://aethal.com/en/" />
    <link rel="alternate" hreflang="ur" href="https://aethal.com/ur/" />

    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.jpg" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Styles -->
    <link rel="stylesheet" href="./styles/main.css" />

    <!-- Performance: preconnect / dns-prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <meta name="GPTBot" content="index, follow" />
    <meta name="OAI-SearchBot" content="index, follow" />
    <meta name="Google-Extended" content="index, follow" />
    <meta name="ClaudeBot" content="index, follow" />
    <meta name="Claude-SearchBot" content="index, follow" />

  <body>
    <!--* LOADING SCREEN START HERE -->
    <div class="loading-screen">

        <div class="loading-screen__center">
          <h1 class="loading-screen__logo">AETHEL</h1>
          <div class="loading-screen__progress">
            <div class="loading-screen__progress-bar"></div>

    <!--* HEADING START HERE -->
    <header class="main-header">
      <!--* TOP HEADER START HERE -->

            <a href="" class="announcement-btn underline-transition">explore offers <i class="ti ti-arrow-narrow-right transition-icon"></i></a>

      </div>
      <!--* TOP HEADER END HERE -->

      <nav class="main-navbar">

          <button id="open-sidemenu__btn"><i class="ti ti-menu-3"></i></button>

          </ul>
          <div class="navbar-icons__container">

            </button>
            <button>
              <i class="ti ti-user-circle"></i>

            </button>

    </header>

      </div>
